# bd-auto configuration for this repo.
#
# Every field has a default, so this file is optional. `bd-auto config show`
# prints the resolved values.

# Gate commands. All must exit 0 for an issue to pass. Run inside the worker's
# worktree, and again on the merged result at the wave barrier.
gate:
  - name: build
    run: go build ./...
  - name: vet
    run: go vet ./...
  - name: test
    run: go test ./...

# The per-issue pipeline, in order. One rule covers every entry: stage: is which
# step this is, agent: is who runs it, run: is a shell command instead. Only two
# stage names are built in — implement and gate — and being built in is not what
# agent: or run: decides.
#
# agent: names a runner role — worker, reviewer, integrator, or any key added
# under runners: below — not a subagent to dispatch. bd-auto spawns the model
# itself. A name that is not a defined role fails at config load rather than
# mid-wave.
#
# gate is the one stage with no agent: it is the gate: commands above, which are
# commands rather than a judgement. A role written on it is an error.
#
# implement is the stage that creates the worktree and branch every later stage
# runs against. It must come first, and agent: chooses which role does the work.
#
# Add your own stages here. A custom review pipeline is just another entry:
#   - stage: security
#     run: ./scripts/security-review.sh
#     optional: true
# run: stages get $BD_ISSUE, $BD_BRANCH, $BD_WORKTREE, $BD_REPO_ROOT and
# $BD_DIFF_FILE in their environment.
pipeline:
  - stage: implement
    agent: worker
  - stage: gate
  - stage: review
    agent: reviewer
    max_rounds: 3

# How the model is run, per role. Every role resolves over "default", so an
# entry only names what it changes. Commented entries are the built-in values.
#
# There is no budget anywhere in this engine: timeout 0 means one model
# invocation is unbounded, and what bounds a run's spend is the set of issues
# chosen before anything is spawned.
#
# permissions defaults to auto. Headless there is nobody to answer a prompt, so
# under auto a worker is refused every write and every shell command; only bypass
# lets one finish. Widening it is a deliberate act: set permissions: bypass below
# to mean it for this repo, or pass --dangerously-skip-permissions to mean it for
# one run. A run that hits the refusal stops and names the tools and the flag.
runners:
  default:
    provider: claude
    model: opus
  # permissions: auto      # scoped | auto | bypass
  # timeout: 0             # seconds; 0 = unlimited
  reviewer:
    model: sonnet
    permissions: scoped
    resume: false          # a reviewer judges the diff fresh each round
  # integrator:
  #   model: opus

# Feedback rounds within one attempt: how many times a failed gate, review or
# guard check may send the work back to the same worker.
#
# This is the primary recovery knob, and retry below is the safety net. That
# order is measured, not assumed — scripts/resume-vs-fresh.sh drained one
# fixture epic twice from the same commit for the same six model processes, and
# recovering inside the session cost 18% less and finished 26% sooner than
# starting a fresh worker. 3 is what the dogfood run needed to clear a hard
# review; past that nothing has been measured.
max_rounds: 3

# Issues in flight at once. The DAG decides how many are genuinely independent;
# this caps how many of them run together.
concurrency: 5

# auto  - drain the selected scope without stopping
# wave  - pause at each wave barrier and wait for `bd-auto run resume`
autonomy: auto

# Extra attempts after the first failure. 1 means "retry once fresh, then park".
# A fresh attempt discards the worktree and the session, so it is the answer to
# a session that has gone wrong in itself — not to work that is merely wrong.
retry: 1

# What a wave barrier does with what its workers found.
#   triage    stage it in .beads/auto/triage.json and file nothing; the command
#             "bd-auto triage" is what turns one into an issue, folds it into an
#             issue that already exists, or discards it
#   defer     file it as an issue, hidden from "bd ready" until a human wants it
#   immediate file it and offer it to the next run
#
# This repo runs triage on its own evidence: measured over its whole history,
# discovered work peaked at 2.27 issues created per issue closed, and nine
# different parent issues each produced exactly two children. A constant two per
# issue is a model answering a question it is expected to have an answer to.
discovered_work: triage

# Where a finished run ends up. On, so a drain publishes nothing by itself: it
# merges every issue branch, in dependency order, onto one temporary epic
# branch, and never writes to the branch you are on. A pull request opens
# against that branch only once the whole run landed clean and the gate is green
# on the merged result; a parked issue or a red gate opens nothing and leaves
# the epic branch in place.
#
# pr: false still produces the branch. branch: false merges straight into your
# own branch and turns the pull request off with it.
handoff:
  branch: true
  pr: true
  remote: origin
  prefix: bd-auto/epic/

# A code index, built once at run start with `graphify extract --code-only` and
# updated at each wave barrier. No model and no API key: it is AST extraction,
# 1.9s for 2199 nodes on this repo.
#
# Off, and it stays off until beads-auto-imp-xhw measures whether it pays. What
# was measured is only half the premise: a broad `graphify query` returns a
# truncated list of symbol locations rather than an explanation, so the index
# saves an agent the search and not the read. The prompt it attaches says so, and
# names the four commands that are cheap and exact — god-nodes, explain, affected
# and path.
#
# Everything here fails open. No graphify on PATH, or a build that fails, means
# no index, no prompt section and no allowlist entry: the run drains exactly as
# it does today. `bd-auto config show` reports graph.built, which is the only way
# to tell an index that exists from one that was merely asked for.
graph:
  enabled: false
  exclude_tests: true      # with tests in, the god-nodes are the test harness
  refresh: true            # re-extract at each barrier that merged something
  roles: [worker, reviewer, integrator]
  # timeout: 300           # seconds; 0 = the package default

# The ask_user tool: a worker that hits a genuine ambiguity can put a question
# to the human watching the run and get an answer back, without ending its
# session to do it.
#
# It only reaches somebody when there is a live view to reach. A run with
# --quiet, --plain, --json or no terminal answers on the spot with "nobody is
# watching, decide for yourself and record what you assumed", so an unattended
# drain degrades to what it did before this existed rather than stalling.
#
# One call blocks for hold seconds and then hands the model a ticket to poll
# with, which is what lets a question outlive any backend's limit on a single
# tool call — Claude Code kills an idle stdio call after thirty minutes.
ask:
  enabled: true
  timeout: 3600            # seconds a question waits; 0 waits forever
  hold: 300                # seconds one call blocks before handing back a ticket
  # The reviewer is deliberately absent: it is read-only and judging somebody
  # else's work, and a reviewer that can question the author of that work is no
  # longer an independent check.
  roles: [worker, integrator]
